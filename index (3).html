<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e13;--bg2:#111820;--bg3:#161d27;
--tx:#e2e8f0;--tx2:#8b95a5;--tx3:#5a6577;
--ac:#00E5FF;--ac2:rgba(0,229,255,0.10);--ac3:rgba(0,229,255,0.25);
--rd:#ef5350;--gn:#26a69a;--or:#ff9800;--pp:#ab47bc;
--bdr:rgba(255,255,255,0.06);
--r:10px;--r2:14px;
}
body{background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none;transition:opacity .2s}
a:hover{opacity:0.8}

.wrap{max-width:780px;margin:0 auto;padding:0 24px}

/* ── Geometric BG ── */
.geo-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;opacity:0.04}
.geo-bg svg{width:100%;height:100%}

/* ── Nav ── */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,14,19,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);padding:12px 0}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-logo{font-size:14px;font-weight:600;color:var(--ac);letter-spacing:0.5px;white-space:nowrap}
.lang-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.lang-btn{padding:3px 10px;border-radius:20px;font-size:11px;color:var(--tx3);border:1px solid transparent;background:transparent;cursor:pointer;font-family:inherit;transition:all .2s}
.lang-btn:hover{color:var(--tx2);border-color:var(--bdr)}
.lang-btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:500}

/* ── Hero ── */
.hero{text-align:center;padding:64px 0 48px}
.hero-title{font-size:clamp(22px,4vw,32px);font-weight:600;line-height:1.3;color:var(--tx);margin-bottom:10px}
.hero-sub{font-size:14px;color:var(--ac);letter-spacing:0.8px;font-weight:400;margin-bottom:20px}
.hero-desc{font-size:15px;color:var(--tx2);max-width:600px;margin:0 auto;line-height:1.8}

/* ── Features ── */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:56px}
.feat-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:20px 16px;text-align:center;transition:border-color .3s}
.feat-card:hover{border-color:var(--ac3)}
.feat-icon{width:40px;height:40px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.feat-card:nth-child(1) .feat-icon{background:rgba(239,83,80,0.12);color:var(--rd)}
.feat-card:nth-child(2) .feat-icon{background:var(--ac2);color:var(--ac)}
.feat-card:nth-child(3) .feat-icon{background:rgba(38,166,154,0.12);color:var(--gn)}
.feat-title{font-size:14px;font-weight:500;margin-bottom:4px}
.feat-desc{font-size:12px;color:var(--tx2);line-height:1.5}

/* ── Pricing ── */
.section-label{font-size:12px;color:var(--tx3);text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px;font-weight:400}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:40px}
.price-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:28px 20px;text-align:center;position:relative;transition:border-color .3s}
.price-card:hover{border-color:var(--ac3)}
.price-card.pop{border:2px solid var(--ac)}
.pop-badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);font-size:11px;font-weight:500;padding:2px 14px;border-radius:20px;white-space:nowrap}
.price-tier{font-size:13px;color:var(--tx2);margin-bottom:6px}
.price-amount{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:500;color:var(--tx);margin-bottom:2px}
.price-per{font-size:12px;color:var(--tx3)}
.price-divider{border:none;border-top:1px solid var(--bdr);margin:14px 0}
.price-local{font-size:13px;color:var(--ac);font-family:'JetBrains Mono',monospace}

/* ── Payment ── */
.pay-section{margin-bottom:28px}
.pay-label{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:12px}
.pay-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pay-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--r);font-size:13px;font-weight:500;font-family:inherit;border:none;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.pay-btn:hover{transform:translateY(-1px);opacity:0.9}
.pay-btn-pp{background:#0070ba;color:#fff}
.pay-btn-sh{background:#ff6b00;color:#fff}
.pay-btn-tv{background:var(--ac2);color:var(--ac);border:1px solid var(--ac3)}

.pay-btn svg{width:18px;height:18px;flex-shrink:0}

/* ── YouTube ── */
.yt-section{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:16px 20px;text-align:center;margin-bottom:40px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.yt-section a{color:#ff4444;font-weight:500}

/* ── Social ── */
.social-row{display:flex;justify-content:center;gap:20px;margin-bottom:40px;flex-wrap:wrap}
.social-link{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx3);transition:color .2s}
.social-link:hover{color:var(--tx)}
.social-link svg{width:18px;height:18px}

/* ── Footer ── */
.footer{text-align:center;font-size:11px;color:var(--tx3);padding:20px 0 32px;border-top:1px solid var(--bdr)}

/* ── RTL ── */
[dir="rtl"]{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif}
[dir="rtl"] .nav .wrap{flex-direction:row-reverse}
[dir="rtl"] .lang-row{justify-content:flex-start}

/* ── Responsive ── */
@media(max-width:600px){
  .price-grid{grid-template-columns:1fr}
  .hero{padding:40px 0 32px}
  .nav .wrap{flex-direction:column;gap:8px}
  .nav-logo{text-align:center}
  .lang-row{justify-content:center}
  [dir="rtl"] .nav .wrap{flex-direction:column}
  [dir="rtl"] .lang-row{justify-content:center}
}

/* ── Animate ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.hero,.feat-grid,.price-grid,.pay-section,.yt-section,.social-row{animation:fadeUp .6s ease both}
.feat-grid{animation-delay:.1s}
.price-grid{animation-delay:.15s}
.pay-section{animation-delay:.2s}
</style>

const order=["en","tr","es","fr","pt","ru","ar","fa","zh","hi"];
let cur="en";

function render(lang){
  cur=lang;
  const d=L[lang];
  document.documentElement.dir=d.dir;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k=el.getAttribute("data-i");
    if(d[k]!=null){
      if(k==="title"){el.innerHTML=d[k].replace(/\n/g,"<br>");}
      else{el.textContent=d[k];}
    }
  });
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.classList.toggle("on",b.dataset.lang===lang);
  });
}

const row=document.getElementById("langRow");
order.forEach(k=>{
  const b=document.createElement("button");
  b.className="lang-btn";
  b.dataset.lang=k;
  b.textContent=L[k].label;
  b.onclick=()=>render(k);
  row.appendChild(b);
});

render("en");
